networks:
  ativaai:
    external: true

services:
  backend-leads:
    build:
      context: ./backend-nest
    container_name: backend-leads
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    expose:
      - "3000"
    networks:
      - ativaai
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend-leads:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api-leads.labsativa.com.br/api
    container_name: frontend-leads
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ativaai
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s