
networks:
  ativaai:
    external: true

services:
  backend-leads:
    image: bigquery-backend-leads:latest
    container_name: backend-leads
    restart: unless-stopped
    environment:
      PORT: "3000"
      MONGO_URI: ${MONGO_URI:?MONGO_URI não configurada}
      MONGO_DB: ${MONGO_DB:-bigquery}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET não configurado}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ETL_URL: ${ETL_URL:-http://etl:8001/process}
      ETL_TIMEOUT_MS: ${ETL_TIMEOUT_MS:-30000}
    expose:
      - "3000"
    networks:
      - ativaai
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend-leads:
    image: bigquery-frontend-leads:latest
    container_name: frontend-leads
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ativaai
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
